[versions]
paper = "1.21.11-R0.1-SNAPSHOT"
jackson = "3.2.4"
jacksonbukkit = "2.0.0"
ocular = "2.4.1"
annotations = "26.1.0"
junit = "6.1.3"
mockito = "5.24.0"
palantir = "2.102.0"
spotless = "8.10.4"
publishdata = "2.3.0"
vanniktech = "0.37.0"
freefair = "9.8.3"

[libraries]
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jacksonbukkit-paper = { module = "de.eldoria.jacksonbukkit:paper", version.ref = "jacksonbukkit" }
ocular = { module = "dev.chojo:ocular", version.ref = "ocular" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

gradle-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
gradle-publishdata = { module = "de.chojo:publishdata", version.ref = "publishdata" }
gradle-vanniktech = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech" }

[plugins]
aggregate-javadoc = { id = "io.freefair.aggregate-javadoc", version.ref = "freefair" }
