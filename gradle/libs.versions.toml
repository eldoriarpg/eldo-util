[versions]
spotless = "8.10.4"
publishdata = "2.0.0"
maven-publish = "0.37.0"

[libraries]
paper = "io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT"
spigot = "org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT"
jackson-dataformat-yaml = "tools.jackson.dataformat:jackson-dataformat-yaml:3.2.4"
jackson-bukkit = "de.eldoria.jacksonbukkit:jackson-bukkit:2.0.0"
ocular = "dev.chojo:ocular:2.3.0"

spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
publishdata-plugin = { module = "de.chojo.publishdata:de.chojo.publishdata.gradle.plugin", version.ref = "publishdata" }
maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
